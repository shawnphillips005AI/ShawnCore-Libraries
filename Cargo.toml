[workspace]
members = [
    "shawncore-pq-crypto",
    "shawncore-rtos-sync",
    "shawncore-ffi",
    "benchmarks",
    "validation"
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "12.3.11"
edition = "2021"
rust-version = "1.88"
repository = "https://github.com/shawnphillips005AI/ShawnCore-Libraries"
license-file = "LICENSE"
publish = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
strip = "symbols"

# ShawnCore USV deployment profile.
# Inherits the existing release hardening and prioritizes code size.
[profile.usv]
inherits = "release"
opt-level = "z"

[profile.lite]
inherits = "release"
opt-level = "z"
debug = false
strip = "symbols"
