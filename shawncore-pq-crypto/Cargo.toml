[package]
name = "shawncore-pq-crypto"
version = "12.3.0"
edition = "2021"
rust-version = "1.85"
description = "No-std hybrid post-quantum cryptography and C FFI for embedded systems"
repository = "https://github.com/shawnphillips005AI/ShawnCore-Libraries"
license-file.workspace = true
publish = false
keywords = ["no-std", "post-quantum", "ml-kem", "ml-dsa", "embedded"]
categories = ["cryptography", "no-std", "embedded"]

[dependencies]
ml-kem = { version = "0.2.3", default-features = false, features = ["deterministic", "zeroize"] }
ml-dsa = { version = "0.1.1", default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "zeroize"] }
sha2 = { version = "0.10", default-features = false }
hmac = "0.12"
hkdf = "0.12"
zeroize = { version = "1.7", default-features = false, features = ["zeroize_derive"] }
subtle = { version = "2.5", default-features = false }
chacha20 = { version = "0.10", default-features = false, features = ["cipher", "zeroize"] }
