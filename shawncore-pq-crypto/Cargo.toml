[package]
name = "shawncore-pq-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "No-std hybrid post-quantum cryptography and C FFI for embedded systems"
repository.workspace = true
license-file.workspace = true
publish.workspace = true
keywords = ["no-std", "post-quantum", "ml-kem", "ml-dsa", "embedded"]
categories = ["cryptography", "no-std", "embedded"]

[dependencies]
ml-kem = { version = "0.3.3", default-features = false, features = ["hazmat", "zeroize"] }
ml-dsa = { version = "0.1.1", optional = true, default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "3.0", default-features = false, features = ["static_secrets", "zeroize"] }
sha2 = { version = "0.11", default-features = false }
hmac = "0.13"
hkdf = "0.13"
zeroize = { version = "1.7", default-features = false, features = ["zeroize_derive"] }
subtle = { version = "2.5", default-features = false }
chacha20 = { version = "0.10", default-features = false, features = ["cipher", "zeroize"] }

[features]
default = ["ml-dsa", "fast-x25519"]
ml-dsa = ["dep:ml-dsa"]
# Precomputed basepoint tables: faster X25519, about 30 KB more code and rodata.
fast-x25519 = ["x25519-dalek/precomputed-tables"]
lite = []
