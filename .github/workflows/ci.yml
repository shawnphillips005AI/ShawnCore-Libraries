name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-none
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: RustSec dependency audit
        run: |
          command -v cargo-audit >/dev/null || cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
          cargo audit --file fuzz/Cargo.lock
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --release --locked
      - run: cargo build --workspace --release --locked
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo check --target aarch64-unknown-none --workspace --locked
      - name: Lite configuration
        run: |
          cargo test -p shawncore-pq-crypto --no-default-features --features lite --locked
          cargo check -p shawncore-ffi --no-default-features --features lite --locked
      - name: Fuzz targets compile
        run: |
          cargo check --manifest-path fuzz/Cargo.toml --bin ffi_aead_fuzz --locked
          cargo check --manifest-path fuzz/Cargo.toml --bin session_replay_fuzz --locked
          cargo check --manifest-path fuzz/Cargo.toml --bin rtos_stateful_fuzz --locked
      - name: Header/archive parity and bare-metal archive self-containment
        run: bash validation/check_archive.sh

  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-unknown-none
      - run: cargo test --workspace --all-targets --locked
      - run: cargo check --target aarch64-unknown-none --workspace --locked

  c-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: make -C integration syntax
      - run: make -C integration run
      - run: make -C integration cxx
      - run: make -C integration asan
      - run: make -C integration valgrind

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - run: bash validation/run_tsan.sh
      - run: bash validation/run_asan.sh

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - run: cargo install cargo-fuzz --version 0.12.0 --locked
      - run: cargo +nightly fuzz run ffi_aead_fuzz -- -runs=10000 -max_len=512
      - run: cargo +nightly fuzz run session_replay_fuzz -- -runs=10000 -max_len=512
      - run: cargo +nightly fuzz run rtos_stateful_fuzz -- -runs=10000 -max_len=512
