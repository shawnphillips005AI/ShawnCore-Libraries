name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-none
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo check --target aarch64-unknown-none --workspace
      - run: cargo build --workspace --release
      - run: cargo doc --workspace --no-deps
      - run: cargo check --manifest-path fuzz/Cargo.toml --bin ffi_aead_fuzz
      - run: cc -std=c11 -Wall -Wextra -Werror -fsyntax-only integration/martac_hal_stubs.c

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - run: cargo install cargo-fuzz --version 0.12.0 --locked
      - run: cargo +nightly fuzz run ffi_aead_fuzz -- -runs=10000 -max_len=512