[package]
name = "shawncore-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "C-linkable static library facade for ShawnCore embedded prototypes"
repository.workspace = true
license-file.workspace = true
publish.workspace = true
keywords = ["no-std", "ffi", "post-quantum", "rtos", "embedded"]
categories = ["external-ffi-bindings", "no-std", "embedded"]

[lib]
crate-type = ["staticlib"]

[dependencies]
shawncore-pq-crypto = { default-features = false, path = "../shawncore-pq-crypto" }
shawncore-rtos-sync = { path = "../shawncore-rtos-sync" }

[features]
default = ["ml-dsa"]
ml-dsa = ["shawncore-pq-crypto/ml-dsa"]
lite = ["shawncore-pq-crypto/lite"]
